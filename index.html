<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Shelf</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121110">
<style>
:root{--bg:#121110;--side:#0e0d0c;--panel:#1a1917;--line:#2a2824;--text:#ece7dd;--dim:#8f8979;--acc:#e8a33d;--sz:176px;--ease:cubic-bezier(.2,.8,.2,1);--mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,select,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{display:grid;grid-template-columns:230px 1fr;height:100%}
aside{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 12px}
.logo{font-weight:800;font-size:21px;letter-spacing:-.04em;padding:0 10px 20px}.logo i{color:var(--acc);font-style:normal}
nav{flex:1;overflow:auto;display:flex;flex-direction:column;gap:1px}
nav h4{margin:18px 10px 6px;font:600 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.nv{display:flex;justify-content:space-between;align-items:center;text-align:left;background:none;border:0;border-radius:7px;padding:7px 10px;color:var(--dim);position:relative;transition:background .25s,color .25s,padding .3s var(--ease)}
.nv:hover{color:var(--text);background:rgba(255,255,255,.04);padding-left:14px}
.nv.on{color:var(--text);background:rgba(255,255,255,.06)}
.nv.on::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--acc);animation:grow .4s var(--ease)}
@keyframes grow{from{transform:scaleY(0)}}
.nv span{font:11px var(--mono);opacity:.7}
.foot{display:flex;flex-direction:column;gap:8px;padding-top:12px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 14px;transition:transform .2s var(--ease),border-color .2s,background .2s}
.btn:hover{border-color:#4b463b;transform:translateY(-1px)}.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);color:#1a1405;border-color:var(--acc);font-weight:700}.btn.pri:hover{background:#f0b255}
kbd{font:11px var(--mono);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--dim)}
.content{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{display:flex;align-items:center;gap:12px;padding:20px 32px 4px;flex-wrap:wrap}
.top h1{margin:0 auto 0 0;font-size:26px;letter-spacing:-.03em}.top h1 small{font:12px var(--mono);color:var(--dim);margin-left:10px;letter-spacing:0}
.ctl{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;outline:none}
.search{width:230px;transition:width .4s var(--ease),border-color .2s}.search:focus{width:320px;border-color:var(--acc)}
input[type=range]{accent-color:var(--acc);width:90px;padding:0}
main{flex:1;overflow:auto;padding:18px 32px 60px}
.hero{position:relative;border-radius:14px;overflow:hidden;min-height:176px;margin-bottom:34px;border:1px solid var(--line);display:flex;align-items:center;gap:22px;padding:22px;background:var(--panel);animation:rise .7s var(--ease) both}
.hero .bg{position:absolute;inset:-40px;background:center/cover;filter:blur(40px) saturate(1.2) brightness(.55);transition:opacity .6s}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(18,17,16,.85),rgba(18,17,16,.2))}
.hero>*{position:relative;z-index:1}.hero .hc{width:104px;flex:none}
.hero small{font:11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}.hero h2{margin:4px 0 14px;font-size:30px;letter-spacing:-.03em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--sz),1fr));gap:26px 20px}
.card{position:relative;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*35ms);perspective:700px;cursor:pointer;border-radius:12px}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:none}}
.cover{position:relative;aspect-ratio:3/4;border-radius:10px;overflow:hidden;background:var(--panel);border:1px solid var(--line);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .3s;box-shadow:0 6px 14px -8px #000}
.card:hover .cover,.card:focus-visible .cover{transform:translateY(-8px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 26px 40px -16px #000;border-color:#554f42}
.cover::after{content:"";position:absolute;inset:0;background:radial-gradient(180px circle at var(--mx,50%) var(--my,0%),rgba(255,255,255,.13),transparent 60%);opacity:0;transition:opacity .3s;pointer-events:none;z-index:1}
.card:hover .cover::after{opacity:1}
.cover .blur{position:absolute;inset:-20px;background:var(--art) center/cover;filter:blur(18px) brightness(.45);opacity:0;transition:opacity .6s}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .6s}
.cover.has .blur,.cover img.ok{opacity:1}
.fallback{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:13px;font-weight:700;font-size:15px;line-height:1.2;letter-spacing:-.01em}
.fallback .g{position:absolute;top:0;right:10px;font-size:96px;font-weight:800;opacity:.18;line-height:1}
.fallback small{font:500 10px var(--mono);opacity:.7;margin-top:5px;letter-spacing:.04em}
.cover.has .fallback{opacity:0;transition:opacity .6s}
.badge{position:absolute;left:8px;bottom:8px;z-index:2;font:700 10px var(--mono);background:rgba(0,0,0,.7);backdrop-filter:blur(6px);border-radius:4px;padding:2px 6px;opacity:0;transform:translateY(6px);transition:all .3s var(--ease)}
.card:hover .badge{opacity:1;transform:none}
.playbtn{position:absolute;z-index:2;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:var(--acc);color:#1a1405;display:grid;place-items:center;font-size:19px;padding-left:3px;transform:scale(.5);opacity:0;transition:all .35s cubic-bezier(.3,1.5,.5,1);box-shadow:0 10px 24px rgba(0,0,0,.5)}
.card:hover .playbtn{transform:scale(1);opacity:1}
.icon{position:absolute;top:8px;z-index:3;width:26px;height:26px;border:0;border-radius:7px;background:rgba(0,0,0,.72);color:#fff;opacity:0;transform:scale(.8);transition:all .25s var(--ease)}
.card:hover .icon,.icon.on{opacity:1;transform:none}.fav{left:8px}.fav.on{color:var(--acc)}.rm{right:8px}.rm:hover{background:#b33}
.meta{padding:11px 2px 0}.meta b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta span{color:var(--dim);font:11px var(--mono)}
.empty{text-align:center;color:var(--dim);margin-top:14vh;animation:rise .6s var(--ease) both}.empty h2{color:var(--text);margin:0 0 6px}
.ov{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;animation:ovin .45s var(--ease) both}
@keyframes ovin{from{opacity:0;transform:scale(1.03)}to{opacity:1;transform:none}}
.ov.out{animation:ovout .3s var(--ease) both}@keyframes ovout{to{opacity:0;transform:scale(.98)}}
.bar{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid var(--line)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;background:#000;position:relative}
.stage canvas{max-width:100%;max-height:100%;aspect-ratio:8/5;background:#0f0e0b;box-shadow:0 0 0 1px var(--line),0 30px 80px rgba(0,0,0,.6);animation:rise .6s var(--ease) both}
.stage iframe{width:100%;height:100%;border:0;animation:rise .5s var(--ease) both}
.loading{position:absolute;color:var(--dim);animation:pulse 1.4s infinite}@keyframes pulse{50%{opacity:.35}}
.mid{align-items:center;justify-content:center;text-align:center}
.sbody{width:min(780px,90vw);animation:step .6s var(--ease) both}
@keyframes step{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.sbody.back{animation-name:stepb}@keyframes stepb{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.sbody h1{font-size:40px;margin:0 0 12px;letter-spacing:-.03em}.sbody p{color:var(--dim);font-size:16px;max-width:540px;margin:0 auto 28px}
.dots{position:absolute;bottom:34px;display:flex;gap:8px}.dots i{width:7px;height:7px;border-radius:9px;background:var(--line);transition:all .4s var(--ease)}.dots i.on{width:26px;background:var(--acc)}
.pickgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:26px;text-align:left}
.pick{cursor:pointer;animation:rise .55s var(--ease) both;animation-delay:calc(var(--i)*70ms)}
.pick .cover{opacity:.5;transition:transform .3s var(--ease),border-color .3s,opacity .3s}
.pick.sel .cover{opacity:1;border-color:var(--acc);transform:translateY(-4px)}
.pick .tick{position:absolute;top:8px;right:8px;z-index:3;width:22px;height:22px;border-radius:50%;background:var(--acc);color:#1a1405;display:grid;place-items:center;font-weight:800;font-size:13px;transform:scale(0);transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.pick.sel .tick{transform:scale(1)}.pick small{color:var(--dim);display:block;margin-top:6px;font-size:11px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.sysgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-width:640px;margin:0 auto 22px}
#pal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.5);display:none;justify-content:center;padding-top:14vh;backdrop-filter:blur(3px)}
#pal.on{display:flex;animation:ovin .2s var(--ease)}
.pbox{width:min(520px,90vw);height:fit-content;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.7)}
.pbox input{width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;font-size:16px;outline:none}
.pbox .it{padding:10px 16px;cursor:pointer;display:flex;justify-content:space-between}.pbox .it.sel{background:rgba(232,163,61,.14)}.pbox span{color:var(--dim)}
#toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,30px);background:var(--text);color:var(--bg);padding:9px 16px;border-radius:8px;opacity:0;transition:all .4s var(--ease);z-index:60;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translate(-50%,0)}
body.drag main{outline:2px dashed var(--acc);outline-offset:-12px}
@media(max-width:860px){.app{grid-template-columns:1fr}aside{display:none}.pickgrid{grid-template-columns:repeat(3,1fr)}.top,main{padding-left:16px;padding-right:16px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
/* ---- glass ---- */
body::before{content:"";position:fixed;inset:-25%;z-index:0;pointer-events:none;background:radial-gradient(38% 38% at 80% 6%,rgba(255,176,64,.26),transparent 70%),radial-gradient(42% 42% at 6% 94%,rgba(70,150,190,.24),transparent 70%),radial-gradient(34% 34% at 52% 58%,rgba(160,110,210,.13),transparent 70%),radial-gradient(30% 30% at 20% 12%,rgba(230,90,110,.10),transparent 70%);animation:drift 36s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate3d(5%,4%,0) scale(1.1) rotate(2deg)}}
.app{position:relative;z-index:1;grid-template-columns:248px 1fr;gap:14px;padding:14px}
.ov{background:radial-gradient(45% 45% at 80% 10%,rgba(255,176,64,.2),transparent 70%),radial-gradient(50% 50% at 10% 90%,rgba(70,150,190,.18),transparent 70%),var(--bg)}
.ov.play{background:#000}
.glass,aside,.top,.pbox,.ccard,.btn{position:relative;background:linear-gradient(135deg,rgba(255,255,255,.11),rgba(255,255,255,.025) 55%,rgba(255,255,255,.055));-webkit-backdrop-filter:blur(26px) saturate(1.9);backdrop-filter:blur(26px) saturate(1.9);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 24px rgba(255,255,255,.035),0 22px 44px -22px rgba(0,0,0,.85);border:0}
.glass::before,aside::before,.top::before,.pbox::before,.ccard::before,.btn::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;background:linear-gradient(140deg,rgba(255,255,255,.6),rgba(255,255,255,.08) 30%,rgba(255,255,255,.02) 62%,rgba(255,255,255,.32));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
aside{border-radius:22px;height:100%;padding:20px 12px 14px}
.top{border-radius:18px;margin:0 0 4px;padding:12px 16px}
.btn{border-radius:11px;overflow:hidden;isolation:isolate;padding:9px 15px;color:var(--text);transition:transform .25s var(--ease),box-shadow .3s}
.btn::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(110px circle at var(--bx,50%) var(--by,0%),rgba(255,255,255,.34),transparent 62%);opacity:0;transition:opacity .3s}
.btn:hover::after{opacity:1}.btn:hover{transform:translateY(-1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 26px rgba(255,255,255,.07),0 16px 30px -14px rgba(0,0,0,.8)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,rgba(255,206,120,.96),rgba(224,148,36,.9));color:#201505;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.65),inset 0 -1px 0 rgba(120,70,0,.35),0 12px 28px -10px rgba(232,163,61,.65)}
.btn.pri::before{background:linear-gradient(140deg,rgba(255,255,255,.85),rgba(255,230,180,.2) 40%,rgba(255,255,255,.1) 70%,rgba(255,255,255,.5))}
.ctl{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.15);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px -12px #000;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:11px}
kbd{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:6px;padding:1px 6px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.nv{border-radius:10px}.nv:hover{background:rgba(255,255,255,.06)}.nv.on{background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.icon{background:rgba(20,19,17,.5);border:1px solid rgba(255,255,255,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.22);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.cv{right:40px}
.badge{background:rgba(20,19,17,.5);border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.playbtn{background:linear-gradient(180deg,rgba(255,206,120,.96),rgba(224,148,36,.92));border:1px solid rgba(255,224,170,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.65),0 12px 28px rgba(0,0,0,.55)}
.pbox{background:rgba(26,25,23,.62);overflow:hidden;border-radius:16px}
.hero .ht{padding:16px 20px;border-radius:16px}
.cover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.05),0 8px 18px -10px #000}
.card:hover .cover,.card:focus-visible .cover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 28px 44px -16px #000}
.art{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
.fallback.bi{background:linear-gradient(180deg,transparent 78%,rgba(0,0,0,.55));color:#fff;padding:0}.fallback.bi .nm,.fallback.bi small{display:none}
.sysf{background:linear-gradient(160deg,var(--c),#17161a 135%)!important;color:#fff;overflow:hidden}
.sysf::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(255,255,255,.07) 0 2px,transparent 2px 14px)}
.sysf .g{font-size:54px!important;top:auto!important;bottom:48px;right:auto!important;left:12px;opacity:.28!important;letter-spacing:-.04em}
.sysf>*{position:relative}.sysf small{opacity:.8!important}
/* consoles menu */
.ov.cons{overflow:auto}.cbody{padding:26px 36px 50px;max-width:1100px;width:100%;margin:0 auto}
.clead{color:var(--dim);margin:0 0 16px;font-size:15px}
.howto{border-radius:16px;padding:16px 20px;margin-bottom:22px;line-height:1.6}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.ccard{border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;animation:rise .5s var(--ease) both;animation-delay:calc(var(--i)*30ms)}
.ccard .chip{align-self:flex-start;font:800 12px var(--mono);letter-spacing:.06em;padding:4px 9px;border-radius:7px;background:var(--c);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.ccard b{font-size:16px}.ccard .exts{display:flex;gap:5px;flex-wrap:wrap}.ccard small{color:var(--dim);line-height:1.4}.ccard .cnt{font:11px var(--mono);color:var(--acc);margin-top:auto}
</style></head>
<body>
<div class="app">
  <aside><div class="logo">Shelf<i>.</i></div><nav id="nav"></nav>
    <div class="foot"><button class="btn" id="cons">Supported consoles</button><button class="btn" id="cmdk">Commands <kbd id="mod">Ctrl K</kbd></button><button class="btn pri" id="add">Add games</button></div></aside>
  <div class="content"><div class="top"><h1 id="ttl"></h1>
    <input class="ctl search" id="q" placeholder="Search  ( / )" aria-label="Search">
    <select class="ctl" id="sort" aria-label="Sort"><option value="title">A–Z</option><option value="played">Recently played</option><option value="added">Recently added</option></select>
    <input type="range" id="size" min="130" max="260" aria-label="Card size"></div>
    <main id="main"></main></div>
</div>
<div id="pal"><div class="pbox"><input id="pin" placeholder="Type a command or game"><div id="plist"></div></div></div>
<div id="toast"></div>
<input type="file" id="file" multiple hidden><input type="file" id="cfile" accept="image/*" hidden>

<script src="systems.js"></script>
<script src="games.js"></script>
<script>
const $ = s => document.querySelector(s), esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
/* ---------- storage ---------- */
let S = Object.assign({ done: false, builtins: [], lib: [], recent: [], fav: [], size: 176, sort: 'title' }, JSON.parse(localStorage.getItem('shelf.v2') || '{}'));
const save = () => localStorage.setItem('shelf.v2', JSON.stringify(S));
const idb = new Promise((ok, no) => { const r = indexedDB.open('shelf', 1); r.onupgradeneeded = () => { r.result.createObjectStore('roms'); r.result.createObjectStore('meta'); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); });
const tx = async (st, mode, fn) => { const d = await idb; return new Promise((ok, no) => { const t = d.transaction(st, mode), q = fn(t.objectStore(st)); t.oncomplete = () => ok(q && q.result); t.onerror = () => no(t.error); }); };
const dbGet = (st, k) => tx(st, 'readonly', s => s.get(k)), dbSet = (st, k, v) => tx(st, 'readwrite', s => s.put(v, k)), dbDel = (st, k) => tx(st, 'readwrite', s => s.delete(k));
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
let swReady = null;
if ('serviceWorker' in navigator) swReady = navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).catch(() => null);

/* ---------- helpers ---------- */
const ext = f => f.split('.').pop().toLowerCase(), sysById = id => SYSTEMS.find(s => s.id === id);
const sysOf = f => SYSTEMS.find(s => s.exts.includes(ext(f)));
const niceTitle = f => f.replace(/\.[^.]+$/, '').replace(/\s*[\(\[].*?[\)\]]/g, '').trim();
const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 2800); };
const items = () => [
  ...S.builtins.map(id => GAMES.find(g => g.id === id)).filter(Boolean).map(g => ({ kind: 'b', id: g.id, title: g.title, sys: 'built', g, added: 0 })),
  ...S.lib.map(l => ({ kind: 'r', ...l }))
];
const sysName = it => it.kind === 'b' ? 'Built in' : sysById(it.sys).name;

/* ---------- cover art ---------- */
const key = s => s.replace(/\.png$/i, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s*[\(\[].*?[\)\]]/g, '').replace(/,\s*the\b/i, '').replace(/^the\s+/i, '').toLowerCase().replace(/&/g, 'and').replace(/[^a-z0-9]/g, '');
const words = s => new Set(s.replace(/\.png$/i, '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s*[\(\[].*?[\)\]]/g, '').toLowerCase().replace(/['’]/g, '').replace(/&/g, ' and ').split(/[^a-z0-9]+/).filter(w => w && !['the', 'of', 'and', 'a'].includes(w)));
const rank = n => (/\((Beta|Proto|Demo|Sample|Unl)/.test(n) ? 10 : 0) + (/\(USA/.test(n) ? 0 : /\(World/.test(n) ? 1 : /\(Europe/.test(n) ? 2 : 3);
const SIB = { gb: 'gbc', gbc: 'gb', ngp: 'ngc', ngc: 'ngp', ws: 'wsc', wsc: 'ws' };
const artUrls = (repo, ref) => { const p = ref.split('/').map(encodeURIComponent).join('/') + '.png'; return [`https://thumbnails.libretro.com/${repo}/${p}`, `https://raw.githubusercontent.com/libretro-thumbnails/${repo}/master/${p}`]; };
/* Name lists: GitHub tree (knows which images exist) -> libretro DAT (official game names, no rate limit) */
async function nameList(repo) {
  const ck = 'art2:' + repo, c = await dbGet('meta', ck); if (c) return c;

async function planImport(files) {

    else if (s.fin) body = `<h1>You’re set</h1><p>${chosen.size ? chosen.size + ' built-in game' + (chosen.size > 1 ? 's' : '') + ' ready.' : 'No built-in games selected.'} Use Add games to import your own, or drag files onto the window.</p><div class="row"><button class="btn" id="bk">Back</button><button class="btn pri" id="nx">Open library</button></div>`;
    else body = `<h1>${s.t}</h1><p>${s.d}</p><div class="row">${i ? '<button class="btn" id="bk">Back</button>' : ''}<button class="btn pri" id="nx">Continue</button></div>`;
    ov.innerHTML = `<div class="sbody ${dir < 0 ? 'back' : ''}">${body}</div><div class="dots">${slides.map((_, n) => `<i class="${n === i ? 'on' : ''}"></i>`).join('')}</div>`;
    ov.querySelectorAll('.pick').forEach(p => p.onclick = () => { const id = p.dataset.id; chosen.has(id) ? chosen.delete(id) : chosen.add(id); p.classList.toggle('sel'); ov.querySelector('#all').textContent = chosen.size === GAMES.length ? 'Clear all' : 'Select all'; });
    const a = ov.querySelector('#all'); if (a) a.onclick = () => { chosen = chosen.size === GAMES.length ? new Set() : new Set(GAMES.map(g => g.id)); draw(); };
    const b = ov.querySelector('#bk'); if (b) b.onclick = () => { dir = -1; i--; draw(); };
    ov.querySelector('#nx').onclick = () => { if (last) { S.builtins = GAMES.map(g => g.id).filter(id => chosen.has(id)); S.done = true; save(); ov.classList.add('out'); setTimeout(() => { ov.remove(); render(); }, 300); } else { dir = 1; i++; draw(); } };
  };
  draw();
}

/* ---------- command palette ---------- */
let psel = 0;
const cmds = () => [
  { n: 'Add games…', h: 'Import', f: () => $('#file').click() },
  { n: 'Supported consoles', h: 'Info', f: consolesView },
  { n: 'Choose built-in games…', h: 'Setup', f: () => setup(3) },
  { n: 'Run welcome tour', h: 'Setup', f: () => setup(0) },
  { n: 'Check storage used', h: 'Info', f: async () => { const e = await navigator.storage.estimate(); toast(`Using ${(e.usage / 1048576).toFixed(0)} MB of ${(e.quota / 1073741824).toFixed(1)} GB available`); } },
  { n: 'Clear covers cache', h: 'Fix', f: async () => { const d = await idb; await new Promise(ok => { const t = d.transaction('meta', 'readwrite'); t.objectStore('meta').clear(); t.oncomplete = ok; }); render(); toast('Cover cache cleared'); } },
  { n: 'Remove all my games', h: 'Danger', f: async () => { if (!confirm('Remove every imported game from this browser?')) return; for (const l of S.lib) await dbDel('roms', l.id); S.lib = []; S.fav = []; S.recent = []; save(); render(); } },
  ...items().map(i => ({ n: 'Play ' + i.title, h: sysName(i), f: () => play(i) }))
];
function pal(open) { $('#pal').classList.toggle('on', open); if (open) { $('#pin').value = ''; psel = 0; $('#pin').focus(); drawPal(); } }
function drawPal() { const q = $('#pin').value.toLowerCase(), l = cmds().filter(c => c.n.toLowerCase().includes(q)).slice(0, 8); psel = Math.min(psel, Math.max(0, l.length - 1));
  $('#plist').innerHTML = l.map((c, n) => `<div class="it ${n === psel ? 'sel' : ''}" data-n="${n}">${esc(c.n)}<span>${esc(c.h)}</span></div>`).join(''); $('#plist').l = l; }
$('#pin').oninput = () => { psel = 0; drawPal(); };
$('#pin').onkeydown = e => { const l = $('#plist').l || []; if (e.key === 'ArrowDown') { psel = Math.min(l.length - 1, psel + 1); drawPal(); e.preventDefault(); } if (e.key === 'ArrowUp') { psel = Math.max(0, psel - 1); drawPal(); e.preventDefault(); } if (e.key === 'Enter' && l[psel]) { pal(false); l[psel].f(); } if (e.key === 'Escape') pal(false); };
$('#plist').onclick = e => { const it = e.target.closest('.it'); if (it) { const c = $('#plist').l[it.dataset.n]; pal(false); c.f(); } };
$('#pal').onclick = e => { if (e.target.id === 'pal') pal(false); };
$('#cmdk').onclick = () => pal(true);
addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); pal(!$('#pal').classList.contains('on')); }
  else if (e.key === '/' && !/INPUT|SELECT/.test(document.activeElement.tagName) && !document.querySelector('.ov')) { e.preventDefault(); $('#q').focus(); }
});
if (/Mac/.test(navigator.platform)) $('#mod').textContent = '⌘ K';
render(); if (!S.done) setup();
</script></body></html>
